[package]
name = "teloxide-cf-workers"
version = "0.2.0"
edition = "2024"
description = "Run a teloxide bot as a Cloudflare Worker: webhook glue macros + runtime"

[features]
default = []
distribution = ["dep:wasm-bindgen"]
storage = ["worker/d1", "dep:thiserror", "dep:serde"]

[dependencies]
console_error_panic_hook = "0.1"
serde_json = "1.0"
teloxide = { git = "https://github.com/YouKnow-sys/teloxide", branch = "wasm", version = "0.17.0", default-features = false }
teloxide-cf-workers-macros = { version = "0.1.0", path = "../teloxide-cf-workers-macros" }
tokio = { version = "1.53", default-features = false, features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
wasm-bindgen = { version = "0.2", optional = true }
worker = "0.8"
thiserror = { version = "2.0", optional = true }
serde = { version = "1.0", optional = true }
